<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/styles.css">
    {{ if .Metadata.Image }}
    <link rel="preload" as="image" href="{{ .Metadata.Image }}" fetchpriority="high">
    {{ end }}
    <title>{{.Metadata.Title}}</title>
    <meta name="description" content="{{.Metadata.MetaDescription}}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{.CanonicalURL}}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{.Metadata.Title}}">
    <meta property="og:description" content="{{.Metadata.MetaDescription}}">
    <meta property="og:url" content="{{.CanonicalURL}}">
    <meta property="og:image"content="{{ if .Metadata.Image }}{{ .SiteUrl }}{{ .Metadata.Image }}{{ end }}">
    <meta property="og:image:alt" content="{{.Metadata.Title}}">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="{{.Metadata.Author}}">
    <meta name="twitter:creator" content="{{.Metadata.Author}}">
    <meta name="twitter:title" content="{{.Metadata.Title}}">
    <meta name="twitter:description" content="{{.Metadata.MetaDescription}}">
    <meta name="twitter:image" content="{{ if .Metadata.Image }}{{ .SiteUrl }}{{ .Metadata.Image }}{{ end }}">
    <meta name="twitter:image:alt" content="{{.Metadata.Title}}">
</head>
<body>
    {{template "header.html" .}}
    <main class="wrap">
        {{.Body | safeHTML}}
    </main>
    {{template "footer.html" .}}
    <script src="/assets/js/main.js" defer></script>
</body>
</html>
